name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: man-kazzab
        run: npm install

      - name: Add Android platform
        working-directory: man-kazzab
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: man-kazzab
        run: npx cap sync android

      - name: Build APK
        working-directory: man-kazzab/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: man-kazzab-debug-apk
          path: man-kazzab/android/app/build/outputs/apk/debug/appdebug.apk
